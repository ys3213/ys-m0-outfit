<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霧晶囊 · 會下雨的漂浮花園</title>
  <script src="lib/p5.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090f20;color:#e6e7f5;font-family:system-ui,'PingFang TC',sans-serif}header{position:absolute;left:5vw;top:4vh;pointer-events:none;z-index:1}small{letter-spacing:.24em;color:#a6bbc9;font-size:11px}h1{font-size:clamp(28px,4vw,50px);font-weight:300;letter-spacing:.14em;margin:14px 0 8px}header p{color:#aeb9ce;font-size:13px;letter-spacing:.08em}main{height:100svh;min-height:540px}canvas{display:block;touch-action:none}footer{position:absolute;bottom:24px;left:5vw;right:5vw;display:flex;align-items:center;gap:14px;flex-wrap:wrap;z-index:2;font-size:12px;color:#aeb9ce}button{border:1px solid #576478;background:#111d31cc;color:#e6e7f5;border-radius:24px;padding:10px 20px;cursor:pointer}button:hover,button:focus-visible{background:#30435b}#status{margin-left:auto;color:#bce5e1}.hint{max-width:520px;line-height:1.8}@media(max-width:650px){header{top:20px}footer{bottom:16px;gap:8px}.hint{font-size:11px}#status{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <header><small>POST-FUTURE ZOO / M2</small><h1>霧晶囊</h1><p>花園不在某個地方。牠們一起成為花園。</p></header>
  <main id="garden" aria-label="透明膜囊與結晶花瓣形成的漂浮生命"></main>
  <footer>
    <button id="rain" type="button">降一場雨</button><button id="vortex" type="button" aria-pressed="false">喚起旋風</button><button id="pause" type="button">暫停觀察</button><button id="reset" type="button">重新萌生</button>
    <span class="hint">移動游標帶來水霧 · 點擊釋放波紋<br>Shift ＋移動帶起旋風 · 空白鍵暫停 · R 重置</span><span id="status" aria-live="polite">花園正在甦醒</span>
  </footer>
  <script src="sketch.js"></script>
</body>
</html>
